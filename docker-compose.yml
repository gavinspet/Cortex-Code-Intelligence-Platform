version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cortex-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cortex}
      MYSQL_USER: ${MYSQL_USER:-cortex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cortex}
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cortex-network

  redis:
    image: redis:7-alpine
    container_name: cortex-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cortex-network

volumes:
  mysql_data:
    driver: local

networks:
  cortex-network:
    driver: bridge
